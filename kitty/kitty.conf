background_opacity 0.6
cursor_trail 1
font_family 0xProto Nerd Font
font_size 12
modify_font cell_width -1px
modify_font cell_height -2px
window_padding_width 2

# Unmap the defaults, including their US physical-key fallbacks.
map --allow-fallback=shifted,ascii kitty_mod+c
map --allow-fallback=shifted,ascii kitty_mod+v
map --allow-fallback=shifted,ascii cmd+v
map --allow-fallback=shifted,ascii kitty_mod+s
map shift+insert

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f search_scrollback

globinclude local.conf
